name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build TileDownloader
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: TileDownloader.csproj

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.0.0-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Restore dependencies
        run: dotnet restore TileDownloader.csproj

      - name: Build (Release)
        run: dotnet build TileDownloader.csproj -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      # 单文件自包含发布：地图源与行政区划数据都已内嵌，发布包只需要一个 exe
      - name: Publish single-file exe (win-x64)
        run: >
          dotnet publish TileDownloader.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      - name: Package single exe
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          $exe = "publish/TileDownloader.exe"
          if (-not (Test-Path $exe)) { throw "publish/TileDownloader.exe not found" }
          $name = "TileDownloader-v$version-win-x64.exe"
          Copy-Item $exe "dist/$name" -Force
          $file = Get-Item "dist/$name"
          Write-Host "Package: $($file.Name) ($([math]::Round($file.Length / 1MB, 2)) MB)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TileDownloader-${{ steps.version.outputs.version }}-win-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: TileDownloader v${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            ## TileDownloader v${{ steps.version.outputs.version }}

            发布包是单个自包含 exe：

            - **TileDownloader-v${{ steps.version.outputs.version }}-win-x64.exe**：自带 .NET 运行时，下载后双击即用，不需要安装 .NET，也不需要额外的数据目录
            - 地图源与省市区数据已内嵌进 exe；如需自定义来源，可在 exe 同目录新建 `Sources` 文件夹放入 JSON（会覆盖内置配置）
          files: dist/*.exe
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
